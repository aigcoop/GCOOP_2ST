<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>지쿱 제품설명서 프롬프트북</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}body{margin:0}img{max-width:100%}
/* Layout: 강의 자료실 — 상단 도구줄(전체 받기·프롬프트 고르기) 아래 브랜드 탭과 슬라이드 썸네일 카드 그리드 */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#15231f; --muted:#5b6b66; --line:#d9e2df;
  --accent:#1f5d4c; --accent-ink:#ffffff; --accent-soft:#e3efea;
  --amber:#b8650f; --amber-soft:#fbefdf;
  --display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17221f; --ink:#e6eeeb; --muted:#97a8a2; --line:#2a3834;
  --accent:#5fbf9f; --accent-ink:#0b1412; --accent-soft:#1c322b; --amber:#f0a75a; --amber-soft:#33261a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17221f; --ink:#e6eeeb; --muted:#97a8a2; --line:#2a3834;
  --accent:#5fbf9f; --accent-ink:#0b1412; --accent-soft:#1c322b; --amber:#f0a75a; --amber-soft:#33261a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:22px}
header{display:grid;gap:10px}
.eyebrow{font-family:var(--display);font-weight:800;font-size:clamp(17px,3.6vw,22px);letter-spacing:-.005em;color:var(--accent)}
h1{word-break:keep-all;font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.panel h2{font-family:var(--display);font-size:17px;font-weight:800;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:600 14px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{flex:1 1 220px;min-width:0;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 13px var(--body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.howto{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}
.preview{margin:0;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:13.5px;white-space:pre-wrap;max-height:260px;overflow:auto;min-width:0}
.preview mark{background:var(--amber-soft);color:var(--amber);border-radius:4px;padding:0 3px;font-weight:600}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 13.5px var(--body);padding:7px 12px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tab small{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.8}
input[type=search]{font:15px var(--body);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:min(280px,100%)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--bg);border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;left:8px;top:8px;font:500 11px var(--mono);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 6px}
.pick{position:absolute;right:8px;top:8px;background:var(--surface);border-radius:6px;padding:2px 6px;font-size:12px;display:flex;gap:4px;align-items:center;cursor:pointer}
.body{padding:12px 12px 14px;display:grid;gap:8px;align-content:start}
.name{font-family:var(--display);font-weight:800;font-size:15.5px;line-height:1.35;margin:0;min-width:0}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.meta .tag{color:var(--accent)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{justify-content:center;padding:8px 6px;font-size:13px;text-align:center}
.acts .wide{grid-column:1/-1}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.selbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.selbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.btn.small{padding:6px 10px;font-size:12.5px}
.zipline{gap:8px;padding-top:10px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="eyebrow">지쿱AI대학교 · 2학년 종합반</div>
    <h1>지쿱 제품설명서<br>프롬프트북</h1>
    <p class="lead">AI 실습에 쓸 지쿱 제품설명서 PDF 50종이에요. 버튼 한 번으로 전부 받거나, 브랜드별·골라서 받거나, 한 개씩 받을 수 있어요.</p>
    <div class="stats"><span>제품 <b id="stCount">50</b>종</span><span>총 <b id="stPages">0</b>쪽</span><span>전체 용량 <b id="stSize">0</b></span></div>
  </header>

  <section class="panel" aria-labelledby="dlTitle">
    <h2 id="dlTitle">한꺼번에 받기</h2>
    <div class="row">
      <button class="btn primary" id="seqAll" type="button">50종 PDF 전부 받기</button>
      <button class="btn" id="seqCat" type="button">지금 보이는 목록 PDF 받기</button>
      <button class="btn" id="stop" type="button" hidden>멈추기</button>
    </div>
    <div class="progress" id="prog" hidden><span id="progText">준비 중</span><div class="bar"><i id="progBar"></i></div></div>
    <p class="note">한 번 누르면 PDF 파일이 하나씩 차례로 다운로드 폴더에 저장돼요. 처음에 브라우저가 <b>“여러 파일 다운로드 허용”</b>을 물으면 <b>허용</b>을 눌러 주세요. 그다음부터는 자동으로 받아져요.</p>
    <div class="row zipline"><span class="note">파일 하나로 묶어 받고 싶다면</span>
      <button class="btn small" id="zipAll" type="button">전체 ZIP</button>
      <button class="btn small" id="zipCat" type="button">보이는 목록 ZIP</button></div>
  </section>


  <div class="filters">
    <div class="tabs" id="tabs" role="group" aria-label="브랜드"></div>
    <input type="search" id="q" placeholder="제품명 검색" aria-label="제품명 검색">
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>검색한 제품이 없어요. 다른 이름으로 찾아보세요.</div>

  <div class="selbar" id="selbar" hidden>
    <span><b id="selCount">0</b>개 선택</span>
    <span class="row"><button class="btn" id="selClear" type="button">선택 해제</button><button class="btn" id="seqSel" type="button">선택한 것 PDF 받기</button><button class="btn" id="zipSel" type="button">ZIP</button></span>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

"pages": 22, "size": 2689669, "parts": ["pdf/p45.pdf"], "thumb": "thumb/t45.jpg"}, {"n": "46", "name": "텔로메라 3종 화장품", "cat": "텔로메라", "pages": 27, "size": 4009272, "parts": ["pdf/p46.pdf"], "thumb": "thumb/t46.jpg"}, {"n": "47", "name": "텔로메라 미스트", "cat": "텔로메라", "pages": 18, "size": 2598798, "parts": ["pdf/p47.pdf"], "thumb": "thumb/t47.jpg"}, {"n": "48", "name": "텔로메라 정", "cat": "텔로메라", "pages": 32, "size": 9903976, "parts": ["pdf/p48.pdf"], "thumb": "thumb/t48.jpg"}, {"n": "49", "name": "텔로메라 지케이", "cat": "텔로메라", "pages": 21, "size": 17372568, "parts": ["pdf/p49.pdf"], "thumb": "thumb/t49.jpg"}, {"n": "50", "name": "텔로미어 자료", "cat": "텔로메라", "pages": 33, "size": 1279431, "parts": ["pdf/p50.pdf"], "thumb": "thumb/t50.jpg"}];
const $=id=>document.getElementById(id);
const fmtMB=b=>(b/1048576).toFixed(b>=10485760?0:1)+"MB";
let state={cat:"전체",q:"",sel:new Set()};

$("stCount").textContent=DATA.length;
$("stPages").textContent=DATA.reduce((a,d)=>a+d.pages,0).toLocaleString();
$("stSize").textContent=Math.round(DATA.reduce((a,d)=>a+d.size,0)/1048576)+"MB";

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* tabs */
const cats=["전체",...new Set(DATA.map(d=>d.cat))];
function renderTabs(){
  $("tabs").innerHTML=cats.map(c=>{const n=c==="전체"?DATA.length:DATA.filter(d=>d.cat===c).length;return `<button type="button" class="tab" data-c="${c}" aria-pressed="${c===state.cat}">${c}<small>${n}</small></button>`}).join("");
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;state.cat=b.dataset.c;renderTabs();renderGrid()});
$("q").addEventListener("input",e=>{state.q=e.target.value.trim();renderGrid()});

function visible(){return DATA.filter(d=>(state.cat==="전체"||d.cat===state.cat)&&(!state.q||d.name.replace(/\s/g,"").includes(state.q.replace(/\s/g,""))))}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderGrid(){
  const v=visible();
  $("empty").hidden=v.length>0;
  $("seqCat").textContent=state.cat==="전체"&&!state.q?"지금 보이는 목록 PDF 받기":`보이는 ${v.length}종 PDF 받기`;
  $("zipCat").textContent=state.cat==="전체"&&!state.q?"보이는 목록 ZIP":`보이는 ${v.length}종 ZIP`;
  $("grid").innerHTML=v.map(d=>`
  <article class="card${state.sel.has(d.n)?" sel":""}" data-n="${d.n}">
    <div class="thumb"><img src="${d.thumb}" alt="${esc(d.name)} 설명서 첫 장" loading="lazy" width="360" height="203">
      <span class="num">${d.n}</span>
      <label class="pick"><input type="checkbox" id="pick${d.n}" data-pick="${d.n}" ${state.sel.has(d.n)?"checked":""}>선택</label></div>
    <div class="body">
      <h3 class="name">${esc(d.name)}</h3>
      <div class="meta"><span class="tag">${d.cat}</span><span>${d.pages}쪽</span><span>${fmtMB(d.size)}</span></div>
      <div class="acts">
        <button class="btn primary" type="button" data-dl="${d.n}">PDF 받기</button>
        <button class="btn" type="button" data-sh="${d.n}">파일 공유</button>
      </div>
    </div>
  </article>`).join("");
}
function renderSel(){$("selbar").hidden=state.sel.size===0;$("selCount").textContent=state.sel.size}

/* files */
async function getBlob(d){
  const bufs=[];
  for(const p of d.parts){const r=await fetch(p);if(!r.ok)throw new Error("fetch");bufs.push(await r.blob())}
  return new Blob(bufs,{type:"application/pdf"});
}
function triggerDownload(href,filename){
  const a=document.createElement("a");a.href=href;a.download=filename;a.rel="noopener";
  document.body.append(a);a.click();a.remove();
}
async function saveFile(filename,data){
  const url=URL.createObjectURL(data);triggerDownload(url,filename);
  setTimeout(()=>URL.revokeObjectURL(url),60000);return true;
}

/* file share (KakaoTalk etc.) */
const fileCache=new Map();
async function getFile(d){
  if(fileCache.has(d.n))return fileCache.get(d.n);
  const blob=await getBlob(d);
  const f=new File([blob],d.name+".pdf",{type:"application/pdf"});
  fileCache.set(d.n,f);return f;
}
function canShareFiles(f){try{return !!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){return false}}
async function shareFile(d,b){
  const old=b.textContent;
  let f=fileCache.get(d.n);
  if(!f){
    b.disabled=true;b.textContent="준비 중";
    try{f=await getFile(d)}catch(e){toast("파일을 불러오지 못했어요. 잠시 후 다시 눌러 주세요.");b.disabled=false;b.textContent=old;return}
    b.disabled=false;b.textContent=old;
  }
  if(!canShareFiles(f)){toast("이 기기에서는 파일 공유가 안 돼요. PDF 받기로 저장한 뒤 카톡에서 파일로 보내 주세요.");return}
  try{await navigator.share({files:[f],title:d.name})}
  catch(err){
    if(err&&err.name==="AbortError")return;
    if(err&&err.name==="NotAllowedError"){b.textContent="공유 준비 완료 · 한 번 더 눌러 주세요";setTimeout(()=>b.textContent=old,6000);return}
    toast("공유하지 못했어요. PDF 받기로 저장한 뒤 보내 주세요.");
  }
}
$("grid").addEventListener("click",async e=>{
  const b=e.target.closest("button");
  if(b&&b.dataset.sh){shareFile(DATA.find(x=>x.n===b.dataset.sh),b);return}
  if(b&&b.dataset.dl){
    const d=DATA.find(x=>x.n===b.dataset.dl);const old=b.textContent;b.disabled=true;b.textContent="불러오는 중";
    triggerDownload(d.parts[0],d.name+".pdf");await new Promise(r=>setTimeout(r,600));
    b.disabled=false;b.textContent=old;
  }
});
$("grid").addEventListener("change",e=>{
  const n=e.target.dataset.pick;if(!n)return;
  e.target.checked?state.sel.add(n):state.sel.delete(n);
  e.target.closest(".card").classList.toggle("sel",e.target.checked);renderSel();
});
$("selClear").addEventListener("click",()=>{state.sel.clear();renderGrid();renderSel()});

let busy=false;
async function zip(list,filename){
  if(busy||!list.length)return;
  if(typeof JSZip==="undefined"){toast("ZIP 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.");return}
  busy=true;document.querySelectorAll(BTNS).forEach(b=>b.disabled=true);
  const prog=$("prog"),bar=$("progBar"),txt=$("progText");prog.hidden=false;
  const total=list.reduce((a,d)=>a+d.size,0);let got=0;
  try{
    const z=new JSZip();
    for(const d of list){
      txt.textContent=`${d.name} 담는 중 (${Math.round(got/1048576)} / ${Math.round(total/1048576)}MB)`;
      z.file(`${d.n}_${d.name}.pdf`,await getBlob(d));
      got+=d.size;bar.style.width=(got/total*90)+"%";
    }
    txt.textContent="ZIP 묶는 중";
    const blob=await z.generateAsync({type:"blob",compression:"STORE"},m=>{bar.style.width=(90+m.percent/10)+"%"});
    bar.style.width="100%";txt.textContent=`${list.length}종 준비 완료`;
    const ok=await saveFile(filename,blob);
    if(ok)txt.textContent=`${list.length}종 ZIP을 저장했어요.`;
  }catch(err){txt.textContent="파일을 불러오다 멈췄어요. 다시 눌러 주세요."}
  busy=false;document.querySelectorAll(BTNS).forEach(b=>b.disabled=false);
}

const BTNS="#zipAll,#zipCat,#zipSel,#seqAll,#seqCat,#seqSel";
let stopFlag=false;
$("stop").addEventListener("click",()=>{stopFlag=true;$("stop").disabled=true});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function sequential(list){
  if(busy||!list.length)return;
  busy=true;stopFlag=false;document.querySelectorAll(BTNS).forEach(b=>b.disabled=true);
  const st=$("stop");st.hidden=false;st.disabled=false;
  const prog=$("prog"),bar=$("progBar"),txt=$("progText");prog.hidden=false;bar.style.width="0";
  let i=0;
  for(;i<list.length&&!stopFlag;i++){
    const d=list[i];
    txt.textContent=`${i+1} / ${list.length} · ${d.name}`;
    triggerDownload(d.parts[0],d.name+".pdf");
    bar.style.width=((i+1)/list.length*100)+"%";
    await sleep(900);
  }
  txt.textContent=stopFlag?`${i}개 받고 멈췄어요`:`${list.length}개 다운로드를 시작했어요. 다운로드 폴더를 확인해 주세요.`;
  st.hidden=true;busy=false;document.querySelectorAll(BTNS).forEach(b=>b.disabled=false);
}
$("seqAll").addEventListener("click",()=>sequential(DATA));
$("seqCat").addEventListener("click",()=>sequential(visible()));
$("seqSel").addEventListener("click",()=>sequential(DATA.filter(d=>state.sel.has(d.n))));
$("zipAll").addEventListener("click",()=>zip(DATA,"지쿱제품설명서_50종.zip"));
$("zipCat").addEventListener("click",()=>{const v=visible();zip(v,`지쿱제품설명서_${state.cat}_${v.length}종.zip`)});
$("zipSel").addEventListener("click",()=>zip(DATA.filter(d=>state.sel.has(d.n)),`지쿱제품설명서_선택_${state.sel.size}종.zip`));

renderTabs();renderGrid();renderSel();
</script>

</body></html>
